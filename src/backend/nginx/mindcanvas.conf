# MindCanvas Backend Nginx Configuration
# 反向代理到 Docker 容器内的 backend 服务
# 使用 Cloudflare 代理模式（橙色云朵），Cloudflare 处理 SSL
# 使用子域名：mindcanvas.escapemobius.cc

# 默认 server - 拒绝通过 IP 地址访问
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# MindCanvas API server
server {
    listen 80;
    server_name mindcanvas.escapemobius.cc;

    # 安全头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 客户端请求体大小限制（用于文件上传）
    client_max_body_size 50M;

    # 代理超时配置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # MindCanvas API 路由（根路径）
    location / {
        proxy_pass http://localhost:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket 支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 缓冲配置
        proxy_buffering off;
        proxy_request_buffering off;
    }
}