version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindcanvas_backend
    ports:
      - "8008:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://mindcanvas:your_secure_password@db:5432/mindcanvas
      - REDIS_URL=redis://redis:6379/0
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY}
      - LOG_LEVEL=INFO
      - DEBUG=False
    volumes:
      - ./app:/app/app
      - ./storage:/app/storage
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - mindcanvas_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15-alpine
    container_name: mindcanvas_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=mindcanvas
      - POSTGRES_PASSWORD=your_secure_password
      - POSTGRES_DB=mindcanvas
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - mindcanvas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindcanvas -d mindcanvas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mindcanvas_redis
    restart: unless-stopped
    networks:
      - mindcanvas_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  mindcanvas_network:
    driver: bridge